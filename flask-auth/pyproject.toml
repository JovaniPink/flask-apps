[project]
name = "flask-auth-webhook"
version = "0.2.0"
description = "Starter authentication webhook for Hasura GraphQL Engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "flask>=3.1,<4",
  "gunicorn>=23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["auth_webhook"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
