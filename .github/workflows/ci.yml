name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: "*/requirements.txt"
      - run: python -m pip install --disable-pip-version-check pip==26.0.1 pip-tools==7.6.0
      - run: ./scripts/compile-python-locks.sh --check

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - flask-auth-dash-bootstrap
          - flask-bootstrap
          - flask-connextion-rest
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.app }}/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt

  mongo-celery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: flask-mongo-celery/requirements.txt
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt
        working-directory: flask-mongo-celery
      - run: docker build --tag flask-mongo-celery:test .
        working-directory: flask-mongo-celery
      - run: docker run --rm flask-mongo-celery:test python -m pytest -q

  sql-celery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flask-sql-celery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: flask-sql-celery/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pip-audit==2.10.1
      - run: python -m pip check
      - run: APP_ENV=Test python -m pytest -q
      - run: python -m pip_audit -r requirements.txt
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up --detach --wait
      - run: curl --fail --silent --show-error http://localhost:5000/healthz
      - if: always()
        run: docker compose down --volumes

  renovate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npx --yes --package renovate renovate-config-validator renovate.json
