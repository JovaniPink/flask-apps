services:
  broker-rabbitmq:
    image: "rabbitmq:4.3-management"
    environment:
      RABBITMQ_DEFAULT_USER: rabbit_user
      RABBITMQ_DEFAULT_PASS: rabbit_password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  db-postgres:
    image: "postgres:18.6"
    environment:
      POSTGRES_DB: flask_deploy
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d flask_deploy"]
      interval: 5s
      timeout: 5s
      retries: 12
  migration:
    build: .
    environment:
      APP_ENV: Production
    command: flask --app app:create_app init-db
    depends_on:
      db-postgres:
        condition: service_healthy
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      APP_ENV: Production
    depends_on:
      broker-rabbitmq:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 12
  api-worker:
    build: .
    command: celery --app tasks.celery worker --loglevel=info
    environment:
      APP_ENV: Production
    depends_on:
      broker-rabbitmq:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
  api-beat:
    build: .
    command: celery --app tasks.celery beat --loglevel=info
    environment:
      APP_ENV: Production
    depends_on:
      broker-rabbitmq:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

volumes:
  pgdata18:
